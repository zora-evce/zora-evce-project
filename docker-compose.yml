version: '3.8'

services:
# Nginx Service for the second instance
  nginx_stag:
    image: nginx:alpine
    container_name: zora_laravel_nginx_stag
    restart: unless-stopped
    ports:
      - "80:80"  # Second instance on port 8081
    volumes:
      - ./laravel-dashboard/:/var/www/html
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network_stag
    depends_on:
      - php_stag

  # PHP-FPM Service for the second instance
  php_stag:
    build:
      context: ./laravel-dashboard # <-- UBAH INI
      dockerfile: ../Dockerfile
    container_name: zora_laravel_php_stag
    restart: unless-stopped
    volumes:
      - ./laravel-dashboard:/var/www/html
    networks:
      - laravel_network_stag
  
  # redis
  redis_stag:
    image: redis:7.2-alpine
    container_name: zora_redis_stag
    restart: unless-stopped
    ports:
      - "6379:6379" # Opsional, untuk debugging dari host
    networks:
      - laravel_network_stag # WAJIB
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

# Server OCPP
  ocpp_server_stag:
    build:
      context: ./ocpp-server
      dockerfile: Dockerfile
    container_name: zora_ocpp_stag
    restart: unless-stopped
    env_file:
      - ./ocpp-env/.env
    volumes:
      - ./ocpp-server:/app
    expose:
      - "9001"
    networks: # <-- BARU
      - laravel_network_stag
    depends_on: # <-- BARU
      - redis_stag
      - php_stag

# Nginx OCPP
  nginx_ocpp:
    image: nginx:1.25-alpine
    container_name: nginx_ocpp_stag
    restart: unless-stopped
    depends_on:
      - ocpp_server_stag
    ports:
      - "9001:9001"
    volumes:
      - ./ocpp-server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    sysctls:
      net.ipv4.tcp_keepalive_time: 60
      net.ipv4.tcp_keepalive_intvl: 30
      net.ipv4.tcp_keepalive_probes: 5
    networks: # <-- BARU
      - laravel_network_stag

networks:
  laravel_network_stag:
    driver: bridge
