version: '3.8'

services:

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=admin@mebi.co.id"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"

    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

    networks:
      - laravel_network


  # ============================
  # NGINX — ZORA
  # ============================
  nginx_zora:
    image: nginx:alpine
    container_name: zora_nginx
    restart: unless-stopped
    depends_on:
      - php_stag
    volumes:
      - ./laravel-dashboard:/var/www/html
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network
    labels:
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.zora.rule=Host(`zora.mebi.co.id`)"
      - "traefik.http.routers.zora.entrypoints=websecure"
      - "traefik.http.routers.zora.tls.certresolver=myresolver"

      # Force HTTPS
      - "traefik.http.routers.zora-http.rule=Host(`zora.mebi.co.id`)"
      - "traefik.http.routers.zora-http.entrypoints=web"
      - "traefik.http.routers.zora-http.middlewares=redirecthttps"
      - "traefik.http.middlewares.redirecthttps.redirectscheme.scheme=https"

      # Service Port
      - "traefik.http.services.zora.loadbalancer.server.port=80"


  # ============================
  # NGINX — CPO
  # ============================
  nginx_cpo:
    image: nginx:alpine
    container_name: cpo_nginx
    restart: unless-stopped
    depends_on:
      - php_stag
    volumes:
      - ./laravel-dashboard:/var/www/html
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network
    labels:
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.cpo.rule=Host(`cpo.mebi.co.id`)"
      - "traefik.http.routers.cpo.entrypoints=websecure"
      - "traefik.http.routers.cpo.tls.certresolver=myresolver"

      # Force HTTPS
      - "traefik.http.routers.cpo-http.rule=Host(`cpo.mebi.co.id`)"
      - "traefik.http.routers.cpo-http.entrypoints=web"
      - "traefik.http.routers.cpo-http.middlewares=redirecthttps"

      # Service Port
      - "traefik.http.services.cpo.loadbalancer.server.port=80"


  # ============================
  # PHP-FPM (satu saja)
  # ============================
  php_stag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zora_php
    restart: unless-stopped
    volumes:
      - ./laravel-dashboard:/var/www/html
    networks:
      - laravel_network
  
    queue:
      # biasanya reuse image yang sama dengan php
      build: .
      # atau: image: your-php-image
      working_dir: /var/www/html
      command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
      restart: unless-stopped
      depends_on:
        - php_stag
      environment:
        - APP_ENV=${APP_ENV}
        - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      volumes:
        - ./:/var/www/html
      
# Server OCPP
  ocpp_server_stag:
    build:
      context: ./ocpp-server
      dockerfile: Dockerfile
    container_name: zora_ocpp_stag
    restart: unless-stopped
    env_file:
      - ./ocpp-env/.env
    volumes:
      - ./ocpp-server:/app
    expose:
      - "9001"
    networks:
      - laravel_network

# Nginx OCPP
  nginx_ocpp:
    image: nginx:1.25-alpine
    container_name: nginx_ocpp_stag
    restart: unless-stopped
    depends_on:
      - ocpp_server_stag
    volumes:
      - ./ocpp-server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    networks:
      - laravel_network
    labels:
      - "traefik.enable=true"

      # Router HTTPS
      - "traefik.http.routers.ocpp.rule=Host(`ocpp.mebi.co.id`)"
      - "traefik.http.routers.ocpp.entrypoints=websecure"
      - "traefik.http.routers.ocpp.tls.certresolver=myresolver"

      # Force Redirect HTTP → HTTPS
      - "traefik.http.routers.ocpp-http.rule=Host(`ocpp.mebi.co.id`)"
      - "traefik.http.routers.ocpp-http.entrypoints=web"
      - "traefik.http.routers.ocpp-http.middlewares=redirecthttps"
      - "traefik.http.middlewares.redirecthttps.redirectscheme.scheme=https"

      # Layanan backend port WS
      - "traefik.http.services.ocpp.loadbalancer.server.port=9001"

networks:
  laravel_network:
    driver: bridge
